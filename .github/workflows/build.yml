name: Build SohranSMP

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 25 (requis par Paper 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilation avec Maven
        run: mvn -B -ntp clean package

      - name: Récupération du nom du jar généré
        id: jarfile
        run: echo "path=$(ls target/*.jar | grep -v original | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload de l'artifact de build
        uses: actions/upload-artifact@v4
        with:
          name: SohranSMP-jar
          path: ${{ steps.jarfile.outputs.path }}
          if-no-files-found: error

      # Ne se déclenche que lorsqu'on pousse un tag de version (ex: v2.0.0),
      # crée automatiquement une Release GitHub avec le jar attaché.
      - name: Création d'une Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jarfile.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
